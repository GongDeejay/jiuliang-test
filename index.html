<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>你，几两？| 酒桌绰号</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap splash-mode">
  <div class="brand"><i></i>酒桌绰号</div>

  <section id="s-intro" class="screen on">
    <div class="splash-main">
      <div class="logo">
        <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <g stroke="#241C14" stroke-width="3.4" stroke-linejoin="round">
            <path d="M41 24 H79 Q83 24 83 28 V34 H37 V28 Q37 24 41 24 Z" fill="#FFCE3A"/>
            <path d="M43 34 H77 V45 H43 Z" fill="#FF6B35"/>
            <path d="M31 45 H89 C91.5 45 92.6 47 92.2 49.6 L88 97 C87 106 33 106 32 97 L27.8 49.6 C27.4 47 28.5 45 31 45 Z" fill="#FF6B35"/>
            <rect x="46" y="59" width="28" height="30" rx="5" fill="#FFF7E3"/>
          </g>
          <text x="60" y="81" text-anchor="middle" font-size="19" font-weight="800" fill="#241C14" font-family="PingFang SC,Hiragino Sans GB,sans-serif">酒</text>
        </svg>
      </div>
      <h1>你，<mark>几两</mark>？</h1>
    </div>
    <div class="splash-bottom">
      <button class="btn" id="start">开始</button>
      <p class="fine">小酌怡情 · 切勿酒驾</p>
    </div>
  </section>

  <section id="s-quiz" class="screen">
    <div class="qhead">
      <div class="pips" id="pips"></div>
      <span class="qcount" id="qcount">1 / 8</span>
    </div>
    <div class="qbody" id="qbody"></div>
  </section>

  <section id="s-name" class="screen"></section>

  <section id="s-result" class="screen"></section>
</div>
<div class="fb" id="fb"></div>
<div class="toast" id="toast"></div>

<script src="vendor/qrcode.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
